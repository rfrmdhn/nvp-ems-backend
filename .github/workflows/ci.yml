name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — unit tests mock Prisma/Redis, so no live
      # database/Redis is needed for `npm run build`/`lint`/`test` to pass.
      DATABASE_URL: postgresql://ems:ems_password@localhost:5432/ems?schema=public
      JWT_SECRET: ci-only-placeholder-secret-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
